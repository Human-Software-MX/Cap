name: "Docker Build Web"

on:
  # Push code to the `deploy` branch → build the image and roll it out to Coolify.
  push:
    branches:
      - deploy
    paths:
      - "apps/web/**"
      - "packages/**"
      - "apps/web/Dockerfile"
      - ".github/workflows/docker-build-web.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the Docker image"
        required: false
        default: "latest"
        type: string

jobs:
  build:
    name: Build Docker Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
      fail-fast: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file
        run: |
          echo "WEB_URL=http://localhost:3000" > .env
          echo "NEXT_PUBLIC_DOCKER_BUILD=true" >> .env

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase GITHUB_REPOSITORY_OWNER
        run: |
          echo "REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER@L}" >>${GITHUB_ENV}

      - name: Build and Push Platform Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/${{ matrix.platform }}
          push: true
          outputs: type=image,name=ghcr.io/${{ env.REPOSITORY_OWNER }}/cap-web,push-by-digest=true
          cache-from: type=gha,scope=buildx-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=buildx-${{ matrix.platform }}

      - name: Export Digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload Digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create Multi-Architecture Manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase GITHUB_REPOSITORY_OWNER
        run: |
          echo "REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER@L}" >>${GITHUB_ENV}

      - name: Create Image Manifest
        id: manifest
        run: |
          TAG="${{ inputs.tag || 'latest' }}"
          IMAGE="ghcr.io/${{ env.REPOSITORY_OWNER }}/cap-web"
          docker buildx imagetools create -t "${IMAGE}:${TAG}" \
            $(find /tmp/digests -type f -not -path "*/\.*" -exec basename {} \; | xargs -I {} echo "${IMAGE}@sha256:{}")
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')
          echo "Manifest digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Coolify
    needs: merge
    runs-on: ubuntu-latest
    # Serialize with redeploy-coolify.yml so two Coolify deploys never overlap.
    concurrency:
      group: coolify-deploy
      cancel-in-progress: false
    steps:
      - name: Trigger Coolify deploy
        env:
          CO_URL: ${{ secrets.COOLIFY_URL }}
          CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          CO_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          resp=$(curl -fsS "${CO_URL}/api/v1/deploy?uuid=${CO_UUID}" -H "Authorization: Bearer ${CO_TOKEN}")
          echo "Coolify response: ${resp}"
          dep=$(echo "${resp}" | python3 -c "import sys,json;print(json.load(sys.stdin)['deployments'][0]['deployment_uuid'])")
          echo "DEPLOYMENT_UUID=${dep}" >> "$GITHUB_ENV"

      - name: Wait for deployment to finish
        env:
          CO_URL: ${{ secrets.COOLIFY_URL }}
          CO_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            st=$(curl -fsS "${CO_URL}/api/v1/deployments/${DEPLOYMENT_UUID}" \
              -H "Authorization: Bearer ${CO_TOKEN}" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('status','?'))")
            echo "attempt ${i}: status=${st}"
            case "${st}" in
              finished) echo "✅ Coolify deployment finished"; exit 0 ;;
              failed|error) echo "::error::Coolify deployment ${st}"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for Coolify deployment"; exit 1
